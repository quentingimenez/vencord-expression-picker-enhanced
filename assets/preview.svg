<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Vencord Expression Picker Enhanced</title>
  <desc id="desc">A large Discord expression picker with a small resize grip in the top-left corner, an upload button in the top-right corner, and favorite stars on GIF tiles.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232428"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3347"/>
      <stop offset="1" stop-color="#241f2e"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3530"/>
      <stop offset="1" stop-color="#29231f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="gripShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Favorite star button, centred on (0,0) -->
    <g id="favorite">
      <circle r="10" fill="#1e1f22" opacity="0.55"/>
      <path d="M0 -5.2 L1.5 -1.6 L5.2 -1.6 L2.2 0.7 L3.3 4.4 L0 2.1 L-3.3 4.4 L-2.2 0.7 L-5.2 -1.6 L-1.5 -1.6 Z" fill="#f0b232"/>
    </g>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- faint chat backdrop -->
  <g opacity="0.45">
    <rect x="0" y="0" width="1200" height="48" fill="#1e1f22"/>
    <rect x="0" y="672" width="1200" height="48" fill="#1e1f22"/>
    <circle cx="48" cy="24" r="14" fill="#2b2d31"/>
    <rect x="76" y="18" width="120" height="12" rx="6" fill="#2b2d31"/>
    <rect x="920" y="686" width="180" height="20" rx="10" fill="#2b2d31"/>
    <circle cx="1140" cy="696" r="14" fill="#2b2d31"/>
  </g>

  <!-- picker panel -->
  <g filter="url(#shadow)">
    <rect x="230" y="80" width="740" height="560" rx="10" fill="#2b2d31" stroke="#111214" stroke-width="1"/>
  </g>

  <!-- nav tabs -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="250" y="100" width="44" height="26" rx="6" fill="#5865f2"/>
    <text x="272" y="118" fill="#ffffff" text-anchor="middle">GIF</text>
    <text x="312" y="118" fill="#b5bac1">Stickers</text>
    <text x="379" y="118" fill="#b5bac1">Emoji</text>
  </g>

  <!-- import button, top-right of the GIF page -->
  <g transform="translate(936 104)" stroke="#b5bac1" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M8 12V2M8 2 5 5M8 2l3 3M2 12v3h12v-3"/>
  </g>

  <!-- search -->
  <g>
    <rect x="250" y="144" width="700" height="38" rx="6" fill="#1e1f22" stroke="#3f4147" stroke-width="1"/>
    <circle cx="272" cy="163" r="6" fill="none" stroke="#949ba4" stroke-width="2"/>
    <path d="M277 168 L 282 173" stroke="#949ba4" stroke-width="2" stroke-linecap="round"/>
    <text x="294" y="168" fill="#6d6f78" font-family="Segoe UI, Arial, sans-serif" font-size="14">Search GIFs</text>
  </g>

  <!-- GIF tiles -->
  <g>
    <!-- row 1 -->
    <rect x="250" y="202" width="167" height="128" rx="6" fill="url(#tile1)"/>
    <rect x="427" y="202" width="167" height="128" rx="6" fill="url(#tile2)"/>
    <rect x="604" y="202" width="167" height="128" rx="6" fill="url(#tile3)"/>
    <rect x="781" y="202" width="169" height="128" rx="6" fill="url(#tile4)"/>
    <!-- row 2 -->
    <rect x="250" y="340" width="167" height="128" rx="6" fill="url(#tile3)"/>
    <rect x="427" y="340" width="167" height="128" rx="6" fill="url(#tile1)"/>
    <rect x="604" y="340" width="167" height="128" rx="6" fill="url(#tile4)"/>
    <rect x="781" y="340" width="169" height="128" rx="6" fill="url(#tile2)"/>
    <!-- row 3 -->
    <rect x="250" y="478" width="167" height="128" rx="6" fill="url(#tile2)"/>
    <rect x="427" y="478" width="167" height="128" rx="6" fill="url(#tile4)"/>
    <rect x="604" y="478" width="167" height="128" rx="6" fill="url(#tile1)"/>
    <rect x="781" y="478" width="169" height="128" rx="6" fill="url(#tile3)"/>

    <!-- GIF labels -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.55">
      <text x="262" y="318">GIF</text>
      <text x="439" y="318">GIF</text>
      <text x="616" y="318">GIF</text>
      <text x="793" y="318">GIF</text>
      <text x="262" y="456">GIF</text>
      <text x="439" y="456">GIF</text>
      <text x="616" y="456">GIF</text>
      <text x="793" y="456">GIF</text>
      <text x="262" y="594">GIF</text>
      <text x="439" y="594">GIF</text>
      <text x="616" y="594">GIF</text>
      <text x="793" y="594">GIF</text>
    </g>

    <!-- Favorite stars: 18px from the top-right corner of each tile -->
    <g>
      <!-- row 1 -->
      <use xlink:href="#favorite" x="399" y="220"/>
      <use xlink:href="#favorite" x="576" y="220"/>
      <use xlink:href="#favorite" x="753" y="220"/>
      <use xlink:href="#favorite" x="932" y="220"/>
      <!-- row 2 -->
      <use xlink:href="#favorite" x="399" y="358"/>
      <use xlink:href="#favorite" x="576" y="358"/>
      <use xlink:href="#favorite" x="753" y="358"/>
      <use xlink:href="#favorite" x="932" y="358"/>
      <!-- row 3 -->
      <use xlink:href="#favorite" x="399" y="496"/>
      <use xlink:href="#favorite" x="576" y="496"/>
      <use xlink:href="#favorite" x="753" y="496"/>
      <use xlink:href="#favorite" x="932" y="496"/>
    </g>
  </g>

  <!-- resize grip, inside the panel's top-left corner -->
  <g filter="url(#gripShadow)">
    <rect x="234" y="84" width="14" height="14" rx="3" fill="#2b2d31" stroke="#b5bac1" stroke-width="1" stroke-dasharray="2 2" opacity="0.9"/>
    <path d="M237 86 L 245 94 M237 90 L 237 86 L 241 86 M245 90 L 245 94 L 241 94"
          fill="none" stroke="#dbdee1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- annotation (on top, so the arrow is not hidden by the panel) -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="66" fill="#dbdee1" font-size="21" font-weight="600">Resize</text>
    <text x="40" y="92" fill="#949ba4" font-size="14">Drag the small grip in the</text>
    <text x="40" y="112" fill="#949ba4" font-size="14">picker's top-left corner.</text>
    <path d="M210 78 C 218 78, 226 80, 233 85" fill="none" stroke="#b5bac1" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M225.6 83.3 L 233 85 L 229.0 78.5" fill="none" stroke="#b5bac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1160" y="66" fill="#dbdee1" font-size="21" font-weight="600" text-anchor="end">Upload</text>
    <text x="1160" y="92" fill="#949ba4" font-size="14" text-anchor="end">Import local GIFs,</text>
    <text x="1160" y="112" fill="#949ba4" font-size="14" text-anchor="end">images and videos.</text>
    <path d="M1032 146 C 1005 146, 970 130, 956 116" fill="none" stroke="#b5bac1" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M958.5 125.7 L 956 116 L 965.1 120.3" fill="none" stroke="#b5bac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bottom caption -->
  <text x="600" y="692" fill="#949ba4" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">
    Resizable GIF / emoji picker — size is remembered
  </text>
</svg>
